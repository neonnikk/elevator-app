server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Пункт 13: gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/rss+xml
        image/svg+xml;
    gzip_min_length 1024;

    # API → бэкенд
    location /api/ {
        proxy_pass http://backend:3015/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Передаём протокол от NPM — бэкенд использует для secure cookie
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # WebSocket → бэкенд
    location /socket.io/ {
        proxy_pass http://backend:3015/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
    }

    # Пункт 14: хешированные бандлы Vite — кешируем на год
    location ~* ^/assets/.+\.(js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Пункт 14: PWA файлы — не кешируем (могут обновляться)
    location ~* \.(webmanifest|json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Статика + SPA fallback
    location / {
        # Пункт 14: index.html не кешируем — браузер всегда проверяет обновление
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
